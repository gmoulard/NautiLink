# NautiLink sur pi-appliance, à installer par « Docker Compose libre » (D-62).
#
# Dans la fiche du service, panneau « Hébergement » de la console pi-appliance :
#   - cocher « Ce service marche sous le chemin /nautilink/ » (nom du service :
#     nautilink) : publié à https://vdl.moulard.org/nautilink/, chemin gardé ;
#   - ne pas cocher « Créer sa base dans PostgreSQL » : la base est le service
#     « base » de ce fichier (D-130), données dans le volume nautilink-base ;
#   - cocher « Envoi d'e-mails » : la console pose PI_SMTP_HOST
#     (pi-appliance-mail, l'adresse du Pi vue des conteneurs) et PI_SMTP_PORT
#     (2525) ; 60 e-mails par heure au plus pour tout le Pi ; sans elles, ce
#     fichier prend pi-appliance-mail:2525 ;
#   - « Domaines renvoyés vers le service » : nautilink.moulard.org.
# Base : joignable par le seul serveur, sur le réseau interne « base-interne »
# (sans accès à internet, aucun port publié). Mot de passe « nautilink » par
# défaut, remplaçable par NAUTILINK_BASE_MOT_DE_PASSE dans .env (lettres et
# chiffres seulement : il entre tel quel dans l'URL ; fixé à la création du
# volume, le changer ensuite demande ALTER USER dans la base).
# Administrateur (RG-ADM-07) : gmoulard@gmail.com par défaut, remplaçable par
# NAUTILINK_ADMINS dans .env ; son compte doit exister, adresse confirmée.
# Connexion par Google ou par Apple : identifiants clients OAuth (pas des
# secrets) à poser dans .env ; vides, ces connexions sont désactivées.
services:
  nautilink:
    # Construction précise du serveur, :<version>-<build> (server/VERSION,
    # docs/09-versions.md, D-128) : la changer ici pour mettre à jour. « :0.0.1 »
    # ou « :latest » resteraient en cache sur le Pi (build 12 gardé après le 13).
    image: ghcr.io/gmoulard/nautilink-serveur:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NAUTILINK_ADRESSE: ":8080"
      # Chemin sous lequel pi-appliance publie le service (Traefik le garde).
      NAUTILINK_CHEMIN: "/nautilink"
      # Adresse des liens envoyés par e-mail (vérification, invitations).
      NAUTILINK_ADRESSE_PUBLIQUE: "https://vdl.moulard.org/nautilink"
      NAUTILINK_BASE: "postgres://nautilink:${NAUTILINK_BASE_MOT_DE_PASSE:-nautilink}@base:5432/nautilink?sslmode=disable"
      # Relais d'e-mails de pi-appliance, même si « Envoi d'e-mails » n'a pas posé
      # PI_SMTP_HOST (pi-appliance-mail : voir extra_hosts).
      NAUTILINK_SMTP_HOTE: "${PI_SMTP_HOST:-pi-appliance-mail}"
      NAUTILINK_SMTP_PORT: "${PI_SMTP_PORT:-2525}"
      NAUTILINK_EXPEDITEUR: "nautilink@moulard.org"
      NAUTILINK_GOOGLE_CLIENTS: "${NAUTILINK_GOOGLE_CLIENTS:-}"
      NAUTILINK_APPLE_CLIENTS: "${NAUTILINK_APPLE_CLIENTS:-}"
      # Noms des lieux (géocodage inverse, D-96) ; vide : coordonnées seules.
      NAUTILINK_NOMINATIM: "https://nominatim.openstreetmap.org"
      # Administrateur (RG-ADM-07) ; remplaçable par NAUTILINK_ADMINS dans .env.
      NAUTILINK_ADMINS: "${NAUTILINK_ADMINS:-gmoulard@gmail.com}"
    # Le serveur réessaie toutes les 5 secondes tant que la base n'est pas prête
    # (premier démarrage plus long sur le Pi) : pas d'attente de « healthy ».
    depends_on:
      - base
    networks:
      - default
      - base-interne
    extra_hosts:
      - "pi-appliance-mail:host-gateway"
    ports:
      - "8080"
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # PostgreSQL propre à NautiLink (D-130), sur le seul réseau interne partagé
  # avec le serveur, aucun port publié. Sauvegarde du volume : Q-85.
  base:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nautilink
      POSTGRES_PASSWORD: "${NAUTILINK_BASE_MOT_DE_PASSE:-nautilink}"
      POSTGRES_DB: nautilink
    volumes:
      - nautilink-base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nautilink", "-d", "nautilink"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    networks:
      - base-interne
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  nautilink-base:

networks:
  base-interne:
    internal: true
