{{template "haut" .}}
<h1>Se connecter</h1>
<div class="carte">
<form method="post" action="{{.Base}}/connexion">
  <input type="hidden" name="retour" value="{{.Retour}}">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{.F.email}}">
  <label for="motdepasse">Mot de passe</label>
  <input id="motdepasse" name="motdepasse" type="password" autocomplete="current-password" required>
  {{if .DemanderAvertissement}}
  <label class="case"><input type="checkbox" name="avertissement" value="{{.VersionAvertissement}}" required>
    <span>L'avertissement a changé : j'ai lu et j'accepte la nouvelle version de l'<a class="lien" href="{{.Avertissement}}" target="_blank" rel="noopener">avertissement</a>.</span></label>
  {{end}}
  <label class="case"><input type="checkbox" name="rester" value="oui"{{if .F.rester}} checked{{end}}>
    <span>Rester connecté</span></label>
  <button type="submit">Se connecter</button>
</form>
<p><a class="lien" href="{{.Base}}/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
</div>
<p>Pas encore de compte ? <a class="lien" href="{{.Base}}/inscription{{if .Retour}}?retour={{.Retour}}{{end}}">Créer un compte</a></p>
{{template "bas" .}}
