{{define "champs-contact"}}
  <div class="grille">
  <div><label for="nom">Nom</label>
  <input id="nom" name="nom" type="text" maxlength="100" value="{{.Nom}}"></div>
  <div><label for="telephone">Téléphone</label>
  <input id="telephone" name="telephone" type="tel" value="{{deref .Telephone}}"></div>
  <div><label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" value="{{deref .Email}}"></div>
  </div>
  <p class="aide">Un numéro de téléphone ou une adresse e-mail au moins. Votre ami reçoit vos messages et vos alertes SOS (les SMS seulement s'il a un numéro), et une invitation à suivre vos navigations.</p>
  <label for="perimetre">Votre ami voit</label>
  <select id="perimetre" name="perimetre">
    <option value="navigateur">Toutes mes navigations, présentes et futures</option>
  </select>
  <p class="aide">Le choix d'une seule navigation viendra avec les navigations.</p>
{{end}}
