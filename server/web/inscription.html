{{template "haut" .}}
{{template "acces-haut" .}}
<h1 id="titre-acces">Créer un compte</h1>
<p class="acces-sous-titre">Créez votre compte NautiLink</p>
<form method="post" action="{{.Base}}/inscription">
  <input type="hidden" name="retour" value="{{.Retour}}">
  <label class="masque" for="nom">Nom</label>
  <div class="champ-icone">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></svg>
    <input id="nom" name="nom" type="text" autocomplete="name" required maxlength="100" placeholder="Nom" value="{{.F.nom}}">
  </div>
  {{template "champ-email" .}}
  {{template "champ-mot-de-passe" "new-password"}}
  <p class="aide">8 caractères au moins.</p>
  <label class="case"><input type="checkbox" name="avertissement" value="{{.VersionAvertissement}}" required>
    <span>J'ai lu et j'accepte l'<a class="lien" href="{{.Avertissement}}" target="_blank" rel="noopener">avertissement : version bêta et responsabilité</a>.</span></label>
  <button class="pleine" type="submit">Créer mon compte</button>
</form>
<p class="acces-pied">Déjà inscrit ? <a class="lien" href="{{.Base}}/connexion{{if .Retour}}?retour={{.Retour}}{{end}}">Se connecter</a></p>
{{template "acces-bas" .}}
{{template "bas" .}}
