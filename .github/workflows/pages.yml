name: Site GitHub Pages

# Publie site/, la démonstration Web (site/app/) et l'APK Android de
# démonstration (site/downloads/nautilink-demo.apk), construits depuis app/.
on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Démonstration Web
        working-directory: app
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/app/ --no-web-resources-cdn
      - name: APK Android de démonstration
        working-directory: app
        run: flutter build apk --release
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r app/build/web _site/app
          mkdir -p _site/downloads
          cp app/build/app/outputs/flutter-apk/app-release.apk _site/downloads/nautilink-demo.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
