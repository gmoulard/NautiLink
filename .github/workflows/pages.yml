name: Site GitHub Pages

# Publie site/ avec les applications de démonstration construites depuis app/ :
#   site/app/                                  démonstration Web (installable sur l'écran d'accueil)
#   site/downloads/nautilink.apk               Android, vraie application (serveur vdl.moulard.org, D-129), signature de débogage
#   site/downloads/nautilink-ios-non-signe.ipa iPhone, vraie application, non signé (AltStore, Sideloadly)
#   site/downloads/nautilink-demo.apk          Android, démonstration, signature de débogage
# La démonstration V0 est terminée et figée (D-144) : démonstration Web et APK
# de démonstration sont toujours construits depuis le commit DEMO_V0_COMMIT,
# en version DEMO_V0_VERSION, quel que soit l'état de app/ ; la vraie
# application suit le code courant. Plus d'IPA de démonstration (D-191).
#   site/downloads/SHA256SUMS.txt              empreintes des fichiers
#   site/downloads/COMMITS.txt                 « fichier commit version build » de chaque application
# Aucune publication sur Google Play (D-61). App Store (D-194, TODO-10.9) : le
# job « ios » construit aussi une version signée et l'envoie à App Store Connect
# quand les secrets APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID,
# APP_STORE_CONNECT_ISSUER_ID et APP_STORE_CONNECT_KEY_P8 sont posés (guide :
# docs/etudes/app-store.md) ; sans eux l'étape est sautée, sans échec.
# Adresse de l'App Store (site/app-store.txt, vide tant que l'application n'est
# pas acceptée) : blocs « app-store » de site/index.html montrés ou retirés.
# Versions (D-128, docs/09-versions.md) : site/VERSION pour le site, version de
# app/pubspec.yaml pour l'application ; build = numéro d'exécution de ce workflow.
#
# Paramètres :
#   - lancement manuel (Actions → Site GitHub Pages → Run workflow) : cases
#     « website » (pages du site et démonstration Web), « android » et « iphone »,
#     cochées par défaut, pour reconstruire ou non chaque livrable ;
#   - push sur main : le site est toujours reconstruit, les applications
#     Android et iPhone seulement si app/ ou ce fichier ont changé (D-191).
# IPA non signée (pas de compte Apple Developer, D-191) : installée avec un
# outil comme AltStore ou Sideloadly et un identifiant Apple.
# Un livrable non reconstruit reprend la version déjà publiée, avec son commit :
#   - APK et IPA : téléchargés depuis le site publié ;
#   - site et démonstration Web : artefact « site-source » de la dernière
#     exécution réussie (conservé 90 jours ; relancer avec « website » cochée
#     s'il a expiré).
on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      website:
        description: "Reconstruire le site et la démonstration Web"
        type: boolean
        default: true
      android:
        description: "Reconstruire l'APK Android"
        type: boolean
        default: true
      iphone:
        description: "Reconstruire l'IPA iPhone (macOS, plus long)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  APK: nautilink-demo.apk
  # Vraie application (NAUTILINK_MODE=reel, D-129).
  APK_PROD: nautilink.apk
  IPA_PROD: nautilink-ios-non-signe.ipa
  # Démonstration V0, figée (D-144).
  DEMO_V0_COMMIT: 8ac9c1af4f8b6be957ca8854770db6304e039a9a
  DEMO_V0_VERSION: "0.0.1"

jobs:
  choix:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.choix.outputs.website }}
      android: ${{ steps.choix.outputs.android }}
      iphone: ${{ steps.choix.outputs.iphone }}
      flutter: ${{ steps.choix.outputs.flutter }}
      app_version: ${{ steps.choix.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: choix
        env:
          EVENEMENT: ${{ github.event_name }}
          WEBSITE: ${{ inputs.website }}
          ANDROID: ${{ inputs.android }}
          IPHONE: ${{ inputs.iphone }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ "$EVENEMENT" = workflow_dispatch ]; then
            website="$WEBSITE"; android="$ANDROID"; iphone="$IPHONE"
          else
            website=true
            # Applications reconstruites aussi quand le mémo sécurité peut changer : il y est intégré,
            # tiré de site/index.html et site/memo.css (RG-SOS-22, D-192).
            if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null \
               || git diff --name-only "$AVANT" HEAD | grep -qE '^(app/|site/index\.html$|site/memo\.css$|\.github/workflows/pages\.yml$)'; then
              android=true
            else
              android=false
            fi
            # IPA reconstruite dans les mêmes cas que l'APK (D-191).
            iphone=$android
          fi
          # Flutter sur Ubuntu (tests, Web, APK) seulement si le site ou l'APK est reconstruit.
          flutter=false
          if [ "$website" = true ] || [ "$android" = true ]; then flutter=true; fi
          # Version de l'application : partie avant « + » de app/pubspec.yaml.
          app_version=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' app/pubspec.yaml)
          {
            echo "website=$website"; echo "android=$android"
            echo "iphone=$iphone"; echo "flutter=$flutter"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"
          echo "Application V$app_version, build $GITHUB_RUN_NUMBER"
          echo "Site : $website, Android : $android, iPhone : $iphone"

  ios:
    needs: choix
    if: needs.choix.outputs.iphone == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Application iPhone non signée (vraie application, D-191)
        working-directory: app
        env:
          DEFINES: --build-number=${{ github.run_number }} --dart-define=NAUTILINK_VERSION=${{ needs.choix.outputs.app_version }} --dart-define=NAUTILINK_BUILD=${{ github.run_number }} --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
        run: |
          ./outils/copier-memo.sh   # mémo sécurité en mer, tiré de site/index.html (RG-SOS-22, D-192)
          flutter pub get
          # Mêmes définitions que l'APK de production.
          flutter build ios --release --no-codesign $DEFINES --dart-define=NAUTILINK_MODE=reel
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qr "../$IPA_PROD" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app/${{ env.IPA_PROD }}
          if-no-files-found: error
          retention-days: 7
      # Version signée pour l'App Store (D-194, TODO-10.9), après l'IPA non
      # signée, toujours publiée sur le site. Signature automatique gérée par
      # Apple (« cloud signing ») avec la clé d'API App Store Connect ; envoi à
      # App Store Connect (TestFlight interne, puis soumission à la main).
      # Un échec ici n'empêche pas la publication du site (continue-on-error) :
      # il se lit dans le journal de l'étape et dans le résumé de l'exécution.
      - name: App Store (version signée envoyée à App Store Connect, D-194)
        continue-on-error: true
        working-directory: app
        env:
          DEFINES: --build-number=${{ github.run_number }} --dart-define=NAUTILINK_VERSION=${{ needs.choix.outputs.app_version }} --dart-define=NAUTILINK_BUILD=${{ github.run_number }} --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Contenu du fichier AuthKey_<id>.p8 tel quel (texte « -----BEGIN
          # PRIVATE KEY----- … ») ; une version en base64 est aussi acceptée.
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          manquants=""
          [ -n "$APPLE_TEAM_ID" ] || manquants="$manquants APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || manquants="$manquants APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || manquants="$manquants APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || manquants="$manquants APP_STORE_CONNECT_KEY_P8"
          if [ -n "$manquants" ]; then
            echo "::notice title=App Store::Étape sautée : secrets absents :$manquants (guide : docs/etudes/app-store.md)"
            exit 0
          fi
          # Clé d'API : seulement sur la machine de construction, effacée à la fin.
          dossier="$HOME/.appstoreconnect/private_keys"
          cle="$dossier/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$dossier"
          trap 'rm -f "$cle"' EXIT
          (
            umask 077
            if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s\n' "$ASC_KEY_P8" > "$cle"
            else
              printf '%s' "$ASC_KEY_P8" | base64 --decode > "$cle"
            fi
          )
          if ! grep -q 'BEGIN PRIVATE KEY' "$cle"; then
            echo "::error title=App Store::APP_STORE_CONNECT_KEY_P8 n'est pas le contenu d'un fichier .p8"
            exit 1
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$cle"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Réglages Flutter (définitions, numéro de build, version de
          # pubspec.yaml) sans construire : xcodebuild compile ensuite le code
          # Dart en mode release, avec les mêmes définitions que l'IPA non signée.
          flutter build ios --release --config-only $DEFINES --dart-define=NAUTILINK_MODE=reel
          archive="$RUNNER_TEMP/NautiLink.xcarchive"
          export_dir="$RUNNER_TEMP/app-store"
          rm -rf "$archive" "$export_dir"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$export_dir" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH[@]}"
          ipa=$(ls "$export_dir"/*.ipa | head -n 1)
          echo "IPA de l'App Store : $ipa"
          # altool lit la clé dans ~/.appstoreconnect/private_keys/AuthKey_<id>.p8.
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          version=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' pubspec.yaml)
          echo "::notice title=App Store::Version $version, build $GITHUB_RUN_NUMBER envoyée à App Store Connect (traitement par Apple : 10 à 30 minutes, puis TestFlight)"

  build:
    needs: [choix, ios]
    # s'exécute aussi quand la construction iPhone a été sautée
    if: ${{ !cancelled() && needs.choix.result == 'success' && needs.ios.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      WEBSITE: ${{ needs.choix.outputs.website }}
      ANDROID: ${{ needs.choix.outputs.android }}
      IPHONE: ${{ needs.choix.outputs.iphone }}
      COMMIT: ${{ github.sha }}
      BUILD: ${{ github.run_number }}
      APP_VERSION: ${{ needs.choix.outputs.app_version }}
      DEFINES: --build-number=${{ github.run_number }} --dart-define=NAUTILINK_VERSION=${{ needs.choix.outputs.app_version }} --dart-define=NAUTILINK_BUILD=${{ github.run_number }} --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
      # NE PAS lire le contexte « env » ici : le contexte env n'existe pas dans l'env d'un job (fichier refusé) ;
      # version et commit de la démonstration sont ajoutés dans les étapes (DEMO_V0_VERSION, DEMO_V0_COMMIT).
      DEFINES_DEMO: --build-number=${{ github.run_number }} --dart-define=NAUTILINK_BUILD=${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Démonstration V0 figée (D-144)
        if: needs.choix.outputs.flutter == 'true'
        run: |
          git worktree add demo-v0 "$DEMO_V0_COMMIT"
          (cd demo-v0/app && ./outils/copier-memo.sh)
      - uses: actions/setup-java@v4
        if: needs.choix.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: needs.choix.outputs.flutter == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tests
        if: needs.choix.outputs.flutter == 'true'
        working-directory: app
        run: |
          ./outils/copier-memo.sh   # mémo sécurité en mer, tiré de site/index.html (RG-SOS-22, D-192)
          flutter pub get
          flutter analyze
          flutter test
      - name: Démonstration Web (V0 figée, D-144)
        if: needs.choix.outputs.website == 'true'
        working-directory: demo-v0/app
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/app/ --no-web-resources-cdn $DEFINES_DEMO --dart-define=NAUTILINK_VERSION=$DEMO_V0_VERSION --dart-define=NAUTILINK_COMMIT=$DEMO_V0_COMMIT
      - name: APK Android (vraie application et démonstration)
        if: needs.choix.outputs.android == 'true'
        working-directory: app
        env:
          # Clé de signature fixe de la production (D-145) : les mises à jour
          # s'installent par-dessus la version précédente. Sans ces secrets,
          # clé de débogage (une désinstallation à chaque version).
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NAUTILINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NAUTILINK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NAUTILINK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$CLE_BASE64" ]; then
            echo "$CLE_BASE64" | base64 -d > "$RUNNER_TEMP/nautilink-production.jks"
            export NAUTILINK_KEYSTORE="$RUNNER_TEMP/nautilink-production.jks"
            echo "APK de production signé avec la clé fixe"
          else
            echo "::warning::Secrets de signature absents : APK de production signé avec une clé de débogage"
          fi
          flutter build apk --release $DEFINES --dart-define=NAUTILINK_MODE=reel
          rm -f "$RUNNER_TEMP/nautilink-production.jks"
          unset NAUTILINK_KEYSTORE
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_PROD"
          # Démonstration V0 depuis son commit figé (D-144).
          (cd ../demo-v0/app && flutter pub get \
            && flutter build apk --release $DEFINES_DEMO --dart-define=NAUTILINK_VERSION=$DEMO_V0_VERSION --dart-define=NAUTILINK_COMMIT=$DEMO_V0_COMMIT --dart-define=NAUTILINK_MODE=demo \
            && cp build/app/outputs/flutter-apk/app-release.apk "../../app/$APK")
      - uses: actions/download-artifact@v4
        if: needs.choix.outputs.iphone == 'true'
        with:
          name: ipa
          path: ipa
      - name: Trouver le site déjà publié
        id: precedent
        if: needs.choix.outputs.website != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 --jq '.artifacts[] | select(.name == "site-source" and (.expired | not)) | .id' | grep -q .; then
              echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Site repris de l'exécution $id"; exit 0
            fi
          done
          echo "::error::Aucun site publié à reprendre (artefact site-source expiré ou absent) : relancer avec la case « website » cochée"
          exit 1
      - uses: actions/download-artifact@v4
        if: needs.choix.outputs.website != 'true'
        with:
          name: site-source
          path: precedent
          run-id: ${{ steps.precedent.outputs.run }}
          github-token: ${{ github.token }}
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assembler le site
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          # source/ : pages du site non complétées, démonstration Web et commit
          # du site ; publiée en artefact pour être reprise quand le site n'est
          # pas reconstruit.
          mkdir -p source
          if [ "$WEBSITE" = true ]; then
            cp -r site source/site
            cp -r demo-v0/app/build/web source/web
            echo "$COMMIT" > source/SITE_COMMIT
            tr -d '[:space:]' < site/VERSION > source/SITE_VERSION
            echo "$BUILD" > source/SITE_BUILD
          else
            cp -r precedent/. source/
          fi
          site_commit=$(cat source/SITE_COMMIT)
          # SITE_VERSION et SITE_BUILD manquent dans les artefacts d'avant D-128.
          site_version=$(cat source/SITE_VERSION 2>/dev/null || echo inconnue)
          site_build=$(cat source/SITE_BUILD 2>/dev/null || echo inconnu)
          mkdir -p _site/downloads
          cp -r source/site/. _site/
          # Adresse de l'App Store (D-194) : première ligne non commentée de
          # site/app-store.txt ; absente, blocs « app-store » retirés des pages.
          app_store=$(grep -v '^[[:space:]]*#' _site/app-store.txt 2>/dev/null | grep -m 1 . | tr -d '[:space:]' || true)
          rm -f _site/app-store.txt
          if [ -n "$app_store" ]; then
            if ! printf '%s' "$app_store" | grep -qE '^https://apps\.apple\.com/[A-Za-z0-9/_.-]+$'; then
              echo "::error::site/app-store.txt : adresse inattendue (attendu https://apps.apple.com/…) : $app_store"
              exit 1
            fi
            sed -i -e "s|@APP_STORE@|$app_store|g" -e 's/ hidden data-app-store/ data-app-store/g' _site/*.html
            echo "Lien de l'App Store : $app_store"
          else
            sed -i '/<!-- app-store:debut/,/<!-- app-store:fin -->/d' _site/*.html
          fi
          cp -r source/web _site/app
          # COMMITS.txt : « fichier commit version build » de chaque application,
          # repris avec le fichier quand l'application n'est pas reconstruite
          # (version et build absents des lignes d'avant D-128).
          curl -fsSL "$SITE/downloads/COMMITS.txt" -o anciens-commits.txt || : > anciens-commits.txt
          reprendre() {
            if curl -fsSL "$SITE/downloads/$1" -o "_site/downloads/$1"; then
              echo "$1 repris du site publié"
              ancien=$(awk -v f="$1" '$1 == f { print ($2 ? $2 : "inconnu"), ($3 ? $3 : "inconnue"), ($4 ? $4 : "inconnu") }' anciens-commits.txt)
              echo "$1 ${ancien:-inconnu inconnue inconnu}" >> _site/downloads/COMMITS.txt
            else
              rm -f "_site/downloads/$1"
              echo "::warning::$1 absent du site publié : lien de téléchargement cassé, relancer avec la case cochée"
            fi
          }
          # Commit et version de chaque fichier : la démonstration vient du commit figé (D-144).
          ligne() {  # ligne <fichier>
            if [ "$1" = "$APK" ]; then echo "$1 $DEMO_V0_COMMIT $DEMO_V0_VERSION $BUILD"
            else echo "$1 $COMMIT $APP_VERSION $BUILD"; fi
          }
          for f in "$APK_PROD" "$APK"; do
            if [ "$ANDROID" = true ]; then
              cp "app/$f" _site/downloads/
              ligne "$f" >> _site/downloads/COMMITS.txt
            else
              reprendre "$f"
            fi
          done
          # IPA de la vraie application seulement (plus de démonstration, D-191).
          if [ "$IPHONE" = true ]; then
            cp "ipa/$IPA_PROD" _site/downloads/
            ligne "$IPA_PROD" >> _site/downloads/COMMITS.txt
          else
            reprendre "$IPA_PROD"
          fi
          # Pied de page : version, build et commit du site ; section « Installer »
          # de index.html (page unique, D-192) : ceux de chaque application.
          champ() { v=$(awk -v f="$1" -v n="$2" '$1 == f { print $n }' _site/downloads/COMMITS.txt); echo "${v:-$3}"; }
          sed -i -e "s/@COMMIT_COURT@/${site_commit::7}/g" -e "s/@COMMIT@/$site_commit/g" \
                 -e "s/@VERSION@/$site_version/g" -e "s/@BUILD@/$site_build/g" _site/*.html
          # @COMMIT_<clé>@, @COMMIT_<clé>_COURT@, @VERSION_<clé>@, @BUILD_<clé>@
          remplir() {  # remplir <clé> <fichier>
            c=$(champ "$2" 2 inconnu)
            sed -i -e "s/@COMMIT_$1_COURT@/${c::7}/g" -e "s/@COMMIT_$1@/$c/g" \
                   -e "s/@VERSION_$1@/$(champ "$2" 3 inconnue)/g" -e "s/@BUILD_$1@/$(champ "$2" 4 inconnu)/g" _site/*.html
          }
          remplir APK "$APK"
          remplir APK_PROD "$APK_PROD"; remplir IPA_PROD "$IPA_PROD"
          cat _site/downloads/COMMITS.txt
          cd _site/downloads
          shopt -s nullglob
          fichiers=(*.apk *.ipa)
          if [ ${#fichiers[@]} -gt 0 ]; then
            sha256sum "${fichiers[@]}" > SHA256SUMS.txt && cat SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-source
          path: source
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
