name: Site GitHub Pages

# Publie site/ avec les applications de démonstration construites depuis app/ :
#   site/app/                                  démonstration Web (installable sur l'écran d'accueil)
#   site/downloads/nautilink-demo.apk          Android, signature de débogage
#   site/downloads/nautilink-demo-ios-non-signe.ipa  iPhone, non signé (AltStore, Sideloadly)
#   site/downloads/SHA256SUMS.txt              empreintes des fichiers
#   site/downloads/COMMITS.txt                 commit de construction de chaque application
# Aucune publication dans les stores (D-61).
#
# Paramètres :
#   - lancement manuel (Actions → Site GitHub Pages → Run workflow) : cases
#     « website » (pages du site et démonstration Web), « android » et « iphone »,
#     cochées par défaut, pour reconstruire ou non chaque livrable ;
#   - push sur main : le site est toujours reconstruit, les applications Android
#     et iPhone seulement si app/ ou ce fichier ont changé.
# Un livrable non reconstruit reprend la version déjà publiée, avec son commit :
#   - APK et IPA : téléchargés depuis le site publié ;
#   - site et démonstration Web : artefact « site-source » de la dernière
#     exécution réussie (conservé 90 jours ; relancer avec « website » cochée
#     s'il a expiré).
on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      website:
        description: "Reconstruire le site et la démonstration Web"
        type: boolean
        default: true
      android:
        description: "Reconstruire l'APK Android"
        type: boolean
        default: true
      iphone:
        description: "Reconstruire l'IPA iPhone (macOS, plus long)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  APK: nautilink-demo.apk
  IPA: nautilink-demo-ios-non-signe.ipa

jobs:
  choix:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.choix.outputs.website }}
      android: ${{ steps.choix.outputs.android }}
      iphone: ${{ steps.choix.outputs.iphone }}
      flutter: ${{ steps.choix.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: choix
        env:
          EVENEMENT: ${{ github.event_name }}
          WEBSITE: ${{ inputs.website }}
          ANDROID: ${{ inputs.android }}
          IPHONE: ${{ inputs.iphone }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ "$EVENEMENT" = workflow_dispatch ]; then
            website="$WEBSITE"; android="$ANDROID"; iphone="$IPHONE"
          else
            website=true
            if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null \
               || git diff --name-only "$AVANT" HEAD | grep -qE '^(app/|\.github/workflows/pages\.yml$)'; then
              android=true; iphone=true
            else
              android=false; iphone=false
            fi
          fi
          # Flutter sur Ubuntu (tests, Web, APK) seulement si le site ou l'APK est reconstruit.
          flutter=false
          if [ "$website" = true ] || [ "$android" = true ]; then flutter=true; fi
          {
            echo "website=$website"; echo "android=$android"
            echo "iphone=$iphone"; echo "flutter=$flutter"
          } >> "$GITHUB_OUTPUT"
          echo "Site : $website, Android : $android, iPhone : $iphone"

  ios:
    needs: choix
    if: needs.choix.outputs.iphone == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Application iPhone non signée
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qr "../$IPA" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app/${{ env.IPA }}
          retention-days: 7

  build:
    needs: [choix, ios]
    # s'exécute aussi quand la construction iPhone a été sautée
    if: ${{ !cancelled() && needs.choix.result == 'success' && needs.ios.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      WEBSITE: ${{ needs.choix.outputs.website }}
      ANDROID: ${{ needs.choix.outputs.android }}
      IPHONE: ${{ needs.choix.outputs.iphone }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: needs.choix.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: needs.choix.outputs.flutter == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tests
        if: needs.choix.outputs.flutter == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Démonstration Web
        if: needs.choix.outputs.website == 'true'
        working-directory: app
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/app/ --no-web-resources-cdn --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
      - name: APK Android de démonstration
        if: needs.choix.outputs.android == 'true'
        working-directory: app
        run: flutter build apk --release --dart-define=NAUTILINK_COMMIT=${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.choix.outputs.iphone == 'true'
        with:
          name: ipa
          path: ipa
      - name: Trouver le site déjà publié
        id: precedent
        if: needs.choix.outputs.website != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 --jq '.artifacts[] | select(.name == "site-source" and (.expired | not)) | .id' | grep -q .; then
              echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Site repris de l'exécution $id"; exit 0
            fi
          done
          echo "::error::Aucun site publié à reprendre (artefact site-source expiré ou absent) : relancer avec la case « website » cochée"
          exit 1
      - uses: actions/download-artifact@v4
        if: needs.choix.outputs.website != 'true'
        with:
          name: site-source
          path: precedent
          run-id: ${{ steps.precedent.outputs.run }}
          github-token: ${{ github.token }}
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assembler le site
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          # source/ : pages du site non complétées, démonstration Web et commit
          # du site ; publiée en artefact pour être reprise quand le site n'est
          # pas reconstruit.
          mkdir -p source
          if [ "$WEBSITE" = true ]; then
            cp -r site source/site
            cp -r app/build/web source/web
            echo "$COMMIT" > source/SITE_COMMIT
          else
            cp -r precedent/. source/
          fi
          site_commit=$(cat source/SITE_COMMIT)
          mkdir -p _site/downloads
          cp -r source/site/. _site/
          cp -r source/web _site/app
          # COMMITS.txt : commit de construction de chaque application, repris
          # avec le fichier quand l'application n'est pas reconstruite.
          curl -fsSL "$SITE/downloads/COMMITS.txt" -o anciens-commits.txt || : > anciens-commits.txt
          reprendre() {
            if curl -fsSL "$SITE/downloads/$1" -o "_site/downloads/$1"; then
              echo "$1 repris du site publié"
              ancien=$(awk -v f="$1" '$1 == f { print $2 }' anciens-commits.txt)
              echo "$1 ${ancien:-inconnu}" >> _site/downloads/COMMITS.txt
            else
              rm -f "_site/downloads/$1"
              echo "::warning::$1 absent du site publié : lien de téléchargement cassé, relancer avec la case cochée"
            fi
          }
          if [ "$ANDROID" = true ]; then
            cp app/build/app/outputs/flutter-apk/app-release.apk "_site/downloads/$APK"
            echo "$APK $COMMIT" >> _site/downloads/COMMITS.txt
          else
            reprendre "$APK"
          fi
          if [ "$IPHONE" = true ]; then
            cp "ipa/$IPA" _site/downloads/
            echo "$IPA $COMMIT" >> _site/downloads/COMMITS.txt
          else
            reprendre "$IPA"
          fi
          # Pieds de page : commit du site ; telecharger.html : commit de chaque application.
          commit_de() { awk -v f="$1" '$1 == f { print $2 }' _site/downloads/COMMITS.txt; }
          apk=$(commit_de "$APK"); ipa=$(commit_de "$IPA")
          apk=${apk:-inconnu}; ipa=${ipa:-inconnu}
          sed -i -e "s/@COMMIT_COURT@/${site_commit::7}/g" -e "s/@COMMIT@/$site_commit/g" \
                 -e "s/@COMMIT_APK_COURT@/${apk::7}/g" -e "s/@COMMIT_APK@/$apk/g" \
                 -e "s/@COMMIT_IPA_COURT@/${ipa::7}/g" -e "s/@COMMIT_IPA@/$ipa/g" _site/*.html
          cat _site/downloads/COMMITS.txt
          cd _site/downloads
          shopt -s nullglob
          fichiers=(*.apk *.ipa)
          if [ ${#fichiers[@]} -gt 0 ]; then
            sha256sum "${fichiers[@]}" > SHA256SUMS.txt && cat SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-source
          path: source
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
