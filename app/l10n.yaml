# Textes de l'interface (TODO-9.2, Q-27) : lib/l10n/app_<langue>.arb.
# Le français est la langue de référence ; le code Dart est généré par `flutter gen-l10n`
# (aussi lancé par `flutter pub get`, `flutter run` et `flutter build`).
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
