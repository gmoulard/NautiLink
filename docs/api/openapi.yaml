  /v1/navigations:
    get:
      tags: [Navigations]
      summary: 'Navigations du compte comme navigateur et comme suiveur (tableau de bord, « Navigations enregistrées »).'
      description: 'Les navigations en cours d''abord, puis l''historique de la plus récente à la plus ancienne. Le suivi est gratuit.'
      x-regles: [RG-PAR-07, RG-PAR-09, RG-ECO-08, RG-NAV-16, RG-NAV-18, RG-BAT-03, RG-IOS-05]
      parameters:
        - name: role
