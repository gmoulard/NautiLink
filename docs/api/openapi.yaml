openapi: 3.1.0
info:
  title: API NautiLink
  version: 0.1.0
  summary: 'API HTTPS entre les applications mobiles, l''Application web, l''espace administrateur et le serveur NautiLink.'
  description: |
    Description de l'API du serveur NautiLink (TODO-3.2). **Validée** : voir
    [D-115](../07-decisions.md#d-115). Les règles métier font foi
    ([02-regles-metier.md](../02-regles-metier.md)) ; chaque opération cite les règles qu'elle
    sert dans `x-regles`. Synchronisation, file d'attente et doublons :
    [08-architecture.md §4 et §5](../08-architecture.md#4-api-et-synchronisation).

    Conventions :
    - JSON en UTF-8 ; noms de champs en français, sans accents, en camelCase.
    - Heures au format RFC 3339 avec décalage horaire (`2026-11-25T14:03:00+01:00`) ; l'heure qui
      fait foi est l'heure d'acquisition sur le téléphone (RG-GPS-02, RG-JRN-03), jamais l'heure de
      réception.
    - Positions en degrés décimaux WGS 84.
    - Durées en minutes, distances en mètres.
    - Identifiants : UUID. Les navigations, événements et alertes SOS reçoivent leur identifiant
      du téléphone qui les crée, ce qui rend chaque envoi rejouable sans doublon (RG-GPS-04, RG-COM-05).
    - Erreurs : objet `Erreur` avec un `code` stable (liste dans le schéma).
    - Les comportements qui attendent une décision renvoient à leur question (`Q-nn`) ; ils ne
      sont pas à développer avant qu'elle soit tranchée.

    Le serveur est la référence pour les paramètres, les accès et le quota (cahier des charges §4).

servers:
  - url: https://vdl.moulard.org/nautilink/api
    description: 'Bêta, Raspberry Pi sous pi-appliance (D-62). Adresse publique https://nautilink.moulard.org.'
  - url: http://localhost:8080/nautilink/api
    description: 'Développement et test (08-architecture.md §6).'

security:
  - jeton: []
  - cookieSession: []

tags:
  - name: Comptes
  - name: Appareils et bateaux
  - name: Contacts et partage
  - name: Paramètres
  - name: Navigations
  - name: Journal de bord
  - name: Alertes SOS
  - name: Quota et abonnement
  - name: Données
  - name: Administration
  - name: Technique

# Traitements faits par le serveur lui-même, sans appel d'un client.
x-traitements:
  - nom: 'Clôture automatique par épuisement du quota'
    description: '24 heures après l''épuisement du quota pendant une navigation en cours, sauf abonnement souscrit entre-temps ; notification au navigateur à l''épuisement et 1 heure avant. Ensuite, événements acquis après l''heure de clôture refusés (`navigation_cloturee`) ; un SOS acquis après la clôture est enregistré comme un SOS depuis l''accueil.'
    x-regles: [RG-NAV-15, RG-ECO-05, RG-ECO-12]
  - nom: 'Calcul du quota'
    description: 'Minutes entre début et fin enregistrés par le téléphone, sur 7 jours glissants, par compte, comme navigateur seulement.'
    x-regles: [RG-ECO-01, RG-ECO-02, RG-ECO-03, RG-NAV-21]
  - nom: 'Lieux et distance'
    description: 'Géocodage inverse par Nominatim avec cache (D-96) pour le lieu de départ, d''arrivée et de chaque position ; distance = somme des distances entre positions successives.'
    x-regles: [RG-NAV-16, RG-NAV-31, RG-JRN-10]
  - nom: 'Météo de début et de fin'
    description: 'Relevée auprès de l''API de Météo-France au point de départ et d''arrivée (Q-39).'
    x-regles: [RG-NAV-28]
  - nom: 'E-mails'
    description: 'Invitation, nouvel accès, alerte SOS, début de navigation, chacun avec copie au navigateur, dans la langue du navigateur ; contenu des e-mails SOS et de début : RG-SOS-17, RG-NOT-05 ; e-mail SOS non accepté par le relais : relancé chaque minute pendant 24 heures (RG-SOS-18).'
    x-regles: [RG-NOT-01, RG-NOT-02, RG-NOT-03, RG-NOT-05, RG-SOS-06, RG-SOS-15, RG-SOS-17, RG-SOS-18, RG-SOS-21, RG-PRM-04, RG-PAR-04]
  - nom: 'Notifications push des suiveurs'
    description: 'APNs (iPhone) et FCM (Android) — SOS, début, fin, nouvelle photo, position en retard (aucune position reçue pendant deux fois la fréquence, une seule notification jusqu''à la position suivante).'
    x-regles: [RG-IOS-06, RG-AND-08, RG-NOT-02]
  - nom: 'Purge de la corbeille'
    description: 'Suppression définitive 30 jours après le passage dans la corbeille, avec le journal de bord, les positions et les fichiers ; les alertes SOS restent dans l''historique du bateau ; les accès de périmètre navigation sur elle sont retirés (RG-PAR-10).'
    x-regles: [RG-NAV-20, RG-PAR-10, RG-DON-01]
  - nom: 'Conservation'
    description: 'Navigations, journaux et positions sans limite ; journaux techniques 1 an ; journaux d''administration 3 ans ; sauvegarde quotidienne gardée 30 jours (pi-appliance pendant la bêta).'
    x-regles: [RG-NAV-18, RG-JRN-01, RG-DON-01, RG-DON-02]
  - nom: 'Fin de l''abonnement'
    description: 'Retour à la version gratuite au bout des 10 ans.'
    x-regles: [RG-ECO-06]

# Règles sans échange propre avec le serveur (appliquées par l'application ou l'écran seuls).
x-regles-sans-serveur: [RG-CPT-03, RG-NAV-09, RG-NAV-12, RG-NAV-23, RG-NAV-24, RG-NAV-29, RG-GPS-01,
  RG-GPS-03, RG-GPS-05, RG-GPS-06, RG-COM-02, RG-COM-03, RG-SMS-03, RG-SMS-04,
  RG-SOS-01, RG-SOS-07, RG-SOS-08, RG-SOS-16, RG-ECO-10, RG-PRM-05, RG-ADM-04, RG-ADM-05,
  RG-IOS-02, RG-IOS-04, RG-IOS-08, RG-IOS-09, RG-AND-01, RG-AND-02, RG-AND-03, RG-AND-04,
  RG-AND-05, RG-AND-06, RG-AND-07, RG-COM-06, RG-SOS-22]

paths:
  /sante:
    get:
      tags: [Technique]
      summary: 'État du serveur (existe dans le squelette, TODO-3.7).'
      security: []
      responses:
        '200':
          description: 'Serveur joignable.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  etat: {type: string, const: ok}
                  version: {type: string, description: 'Version du serveur (server/VERSION, D-128), par exemple 0.0.1.'}
                  build: {type: string, description: 'Numéro d''exécution du workflow « Serveur » ; « local » hors image.'}
                  commit: {type: string, description: 'SHA complet du commit construit ; vide hors image.'}
                  base: {type: string, enum: [ok, absente, erreur]}

  # ---------------------------------------------------------------- Comptes
  /v1/avertissement:
    get:
      tags: [Comptes]
      summary: 'Version en vigueur de l''avertissement bêta.'
      security: []
      x-regles: [RG-CPT-06, RG-CPT-07]
      responses:
        '200':
          description: 'Version et adresse du texte.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Avertissement'}
  /v1/comptes:
    post:
      tags: [Comptes]
      summary: 'Créer un compte par e-mail et mot de passe.'
      description: 'Refusé sans acceptation de la version en vigueur de l''avertissement bêta (`avertissement_a_accepter`) ou si l''adresse a déjà un compte (409 `email_deja_utilise`). Ouvre une session et envoie l''e-mail de vérification de l''adresse : tant qu''elle n''est pas confirmée, le compte ne peut ni démarrer une navigation ni inviter (403 `email_non_verifie`, RG-CPT-09). Mot de passe haché (argon2id) ; 10 créations par adresse IP et par heure au plus.'
      security: []
      x-regles: [RG-CPT-01, RG-CPT-02, RG-CPT-06, RG-CPT-09, RG-PRM-03, RG-PRM-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreationCompte'}
      responses:
        '201':
          description: 'Compte créé, session ouverte.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '409': {$ref: '#/components/responses/Conflit'}
        '422': {$ref: '#/components/responses/Invalide'}
        '429': {$ref: '#/components/responses/TropDEssais'}
  /v1/sessions:
    post:
      tags: [Comptes]
      summary: 'Ouvrir une session.'
      description: |
        E-mail et mot de passe, ou jeton d'identité Google ou Apple. Une première connexion par Google
        ou Apple crée le compte, avec la même acceptation de l'avertissement que `POST /v1/comptes` ;
        l''adresse d''un compte NautiLink existant est rattachée à ce compte si le fournisseur la garantit
        vérifiée, sinon refusée (409 `email_deja_utilise`, RG-CPT-11).
        Fournisseur sans identifiant client configuré : 501 `fournisseur_indisponible`. Après 5 mots
        de passe faux pour un compte, ou 20 pour une adresse IP, en 15 minutes : 429.
        Une session expire après 90 jours sans usage, jamais sur le téléphone associé pendant une
        navigation en cours (RG-CPT-08).
      security: []
      x-regles: [RG-CPT-02, RG-CPT-06, RG-CPT-08, RG-CPT-11, RG-CPT-12, RG-DON-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Connexion'}
      responses:
        '200':
          description: 'Session ouverte.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
        '409': {$ref: '#/components/responses/Conflit'}
        '429': {$ref: '#/components/responses/TropDEssais'}
        '501':
          description: 'Connexion par ce fournisseur pas encore disponible.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erreur'}
        '428':
          description: 'Avertissement bêta pas encore accepté (premier compte Google ou Apple) ou nouvelle version à accepter.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erreur'}
  /v1/sessions/renouvellement:
    post:
      tags: [Comptes]
      summary: 'Renouveler une session avec le jeton de renouvellement (90 jours sans usage, RG-CPT-08).'
      security: []
      x-regles: [RG-CPT-08, RG-CPT-12, RG-DON-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jetonRenouvellement]
              properties:
                jetonRenouvellement: {type: string}
      responses:
        '200':
          description: 'Nouvelle session.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/NonAuthentifie'}
  /v1/sessions/courante:
    delete:
      tags: [Comptes]
      summary: 'Se déconnecter.'
      description: 'La déconnexion ne vide pas la file d''attente du téléphone (RG-CPT-08).'
      x-regles: [RG-CPT-08, RG-DON-03]
      responses:
        '204': {description: Session fermée.}
  /v1/compte:
    get:
      tags: [Comptes]
      summary: 'Profil de l''utilisateur connecté.'
      x-regles: [RG-CPT-01, RG-SMS-01, RG-SMS-08, RG-PRM-03, RG-NOT-02, RG-NOT-04, RG-IOS-06, RG-AND-08, RG-CPT-07]
      responses:
        '200':
          description: 'Profil.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profil'}
    patch:
      tags: [Comptes]
      summary: 'Modifier le profil (nom, téléphone, langue, « Recevoir les SMS », désinscriptions).'
      description: |
        « Recevoir les SMS » passe à vrai dès qu'un numéro est renseigné pour la première fois
        (RG-SMS-01). Le SOS ne se désactive ni par e-mail ni par push (RG-NOT-02, RG-IOS-06,
        RG-AND-08). Les désinscriptions valent pour tous les navigateurs suivis (RG-NOT-04).
      x-regles: [RG-SMS-01, RG-PRM-03, RG-NOT-02, RG-NOT-04, RG-IOS-06, RG-AND-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilModifiable'}
      responses:
        '200':
          description: 'Profil modifié.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profil'}
        '422': {$ref: '#/components/responses/Invalide'}
  /v1/compte/avertissement:
    post:
      tags: [Comptes]
      summary: 'Accepter la version en vigueur de l''avertissement bêta.'
      description: 'Enregistre la date et la version acceptée ; demandé à la connexion suivante quand le texte change.'
      x-regles: [RG-CPT-06, RG-CPT-07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string}
      responses:
        '204': {description: Acceptation enregistrée.}
        '409': {$ref: '#/components/responses/Conflit'}
  /v1/compte/verification:
    post:
      tags: [Comptes]
      summary: 'Confirmer l''adresse e-mail avec le jeton du lien reçu (page Web `/verification?jeton=…`).'
      description: 'Lien à usage unique, valable 7 jours (RG-CPT-09).'
      security: []
      x-regles: [RG-CPT-02, RG-CPT-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jeton]
              properties:
                jeton: {type: string}
      responses:
        '204': {description: Adresse confirmée.}
        '404': {$ref: '#/components/responses/Introuvable'}
  /v1/compte/verification/envoi:
    post:
      tags: [Comptes]
      summary: 'Recevoir un nouveau lien de vérification (5 par heure au plus).'
      x-regles: [RG-CPT-02]
      responses:
        '204': {description: 'E-mail envoyé, ou adresse déjà confirmée.'}
        '429': {$ref: '#/components/responses/TropDEssais'}
  /v1/compte/mot-de-passe/oubli:
    post:
      tags: [Comptes]
      summary: '« Mot de passe oublié ? » : recevoir un lien pour choisir un nouveau mot de passe.'
      description: |
        Lien vers la page Web `/mot-de-passe?jeton=…`, valable 1 heure et à usage unique, envoyé à un
        compte inscrit par e-mail. Même réponse que l'adresse ait un compte ou non ; 5 e-mails par
        compte et 10 demandes par adresse IP par heure au plus.
      security: []
      x-regles: [RG-CPT-10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: 'Demande prise en compte.'}
        '429': {$ref: '#/components/responses/TropDEssais'}
  /v1/compte/mot-de-passe:
    post:
      tags: [Comptes]
      summary: 'Choisir un nouveau mot de passe avec le jeton du lien reçu.'
      description: 'Change le mot de passe (8 caractères au moins) et ferme toutes les sessions du compte, sur le Web et sur les téléphones.'
      security: []
      x-regles: [RG-CPT-10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jeton, motDePasse]
              properties:
                jeton: {type: string}
                motDePasse: {type: string, minLength: 8}
      responses:
        '204': {description: 'Mot de passe changé ; reconnectez-vous.'}
        '404': {$ref: '#/components/responses/Introuvable'}
        '422': {$ref: '#/components/responses/Invalide'}

  # ---------------------------------------------------- Appareils et bateaux
  /v1/appareils/{appareilId}:
    parameters:
      - {$ref: '#/components/parameters/AppareilId'}
    put:
      tags: [Appareils et bateaux]
      summary: 'Enregistrer ou mettre à jour le téléphone de l''utilisateur (plateforme, jeton push).'
      description: 'L''identifiant est tiré au hasard par l''application à sa première ouverture et gardé sur le téléphone. La session qui l''enregistre lui est rattachée (RG-CPT-08). Un téléphone déjà enregistré par un autre compte passe à ce compte : il est retiré des bateaux de l''ancien compte, dont le propriétaire est prévenu par e-mail (RG-BAT-04).'
      x-regles: [RG-BAT-02, RG-BAT-04, RG-IOS-01, RG-IOS-06, RG-AND-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Appareil'}
      responses:
        '200':
          description: 'Appareil enregistré.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appareil'}
        '403': {$ref: '#/components/responses/Interdit'}
        '422': {$ref: '#/components/responses/Invalide'}
  /v1/bateaux:
    get:
      tags: [Appareils et bateaux]
      summary: 'Bateaux du compte.'
      x-regles: [RG-CPT-04, RG-NAV-02]
      responses:
        '200':
          description: 'Liste.'
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Bateau'}
    post:
      tags: [Appareils et bateaux]
      summary: 'Créer un bateau ; le compte connecté en est le propriétaire.'
      x-regles: [RG-CPT-04, RG-BAT-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BateauModifiable'}
      responses:
        '201':
          description: 'Bateau créé.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bateau'}
        '422': {$ref: '#/components/responses/Invalide'}
  /v1/bateaux/{bateauId}:
    parameters:
      - {$ref: '#/components/parameters/BateauId'}
    get:
      tags: [Appareils et bateaux]
      summary: 'Fiche bateau (propriétaire, ou suiveur d''une de ses navigations).'
      x-regles: [RG-BAT-01, RG-PAR-08]
      responses:
        '200':
          description: 'Fiche.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bateau'}
        '404': {$ref: '#/components/responses/Introuvable'}
    patch:
      tags: [Appareils et bateaux]
      summary: 'Modifier la fiche (propriétaire seulement).'
      description: 'Seuls les champs envoyés sont modifiés (RG-COM-04) ; `null` efface un champ facultatif.'
      x-regles: [RG-BAT-01, RG-CPT-04, RG-COM-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BateauModifiable'}
      responses:
        '200':
          description: 'Fiche modifiée.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bateau'}
        '403': {$ref: '#/components/responses/Interdit'}
  /v1/bateaux/{bateauId}/photo:
    parameters:
      - {$ref: '#/components/parameters/BateauId'}
    put:
      tags: [Appareils et bateaux]
      summary: 'Photo du bateau (JPEG, 5 Mo au plus ; propriétaire seulement).'
      x-regles: [RG-BAT-01]
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
      responses:
        '204': {description: Photo enregistrée.}
        '403': {$ref: '#/components/responses/Interdit'}
        '413': {description: Photo trop grosse.}
        '415': {description: Pas une image JPEG.}
        '422': {$ref: '#/components/responses/Invalide'}
    get:
      tags: [Appareils et bateaux]
      summary: 'Lire la photo du bateau.'
      x-regles: [RG-BAT-01, RG-PAR-08]
      responses:
        '200':
          description: 'Photo.'
          content:
            image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
  /v1/bateaux/{bateauId}/telephone:
    parameters:
      - {$ref: '#/components/parameters/BateauId'}
    put:
      tags: [Appareils et bateaux]
      summary: 'Associer un téléphone au bateau ; remplace l''association précédente.'
      description: 'Le téléphone doit être enregistré par le propriétaire du bateau (`PUT /v1/appareils/{appareilId}`), sinon 403.'
      x-regles: [RG-BAT-02, RG-IOS-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appareilId]
              properties:
                appareilId: {type: string, format: uuid}
      responses:
        '200':
          description: 'Association enregistrée.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bateau'}
        '403': {$ref: '#/components/responses/Interdit'}

  # ---------------------------------------------------- Contacts et partage
  /v1/contacts:
    get:
      tags: [Contacts et partage]
      summary: 'Liste unique des contacts du navigateur.'
      description: 'L''application mobile la récupère au lancement et en garde une copie locale. `depuis` ne renvoie que ce qui a changé, suppressions comprises.'
      x-regles: [RG-CTC-01, RG-CTC-03, RG-SOS-05]
      parameters:
        - {$ref: '#/components/parameters/Depuis'}
      responses:
        '200':
          description: 'Contacts.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListeContacts'}
    post:
      tags: [Contacts et partage]
      summary: 'Ajouter un contact (depuis le Web, l''application mobile ou l''écran de démarrage).'
      description: |
        Les deux cases sont cochées par défaut ; sans numéro, « Contact SOS » est décoché, et refusé
        s'il est demandé (code `contact_sos_sans_telephone`). Cocher « Suiveur » demande le périmètre
        et crée une invitation : par e-mail si l'adresse est connue, sinon par téléphone (lien rendu
        par `GET /v1/invitations`). Identifiant tiré par le client pour un ajout hors connexion : un
        renvoi rend le contact existant (200), sans doublon. Sans nom, le contact prend son e-mail ou
        son numéro comme nom.
      x-regles: [RG-CTC-01, RG-CTC-02, RG-CTC-04, RG-CTC-05, RG-NAV-26]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactModifiable'}
      responses:
        '200':
          description: 'Déjà reçu (renvoi d''un ajout hors connexion) ; aucun doublon.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '201':
          description: 'Contact créé.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '422': {$ref: '#/components/responses/Invalide'}
  /v1/contacts/{contactId}:
    parameters:
      - {$ref: '#/components/parameters/ContactId'}
    patch:
      tags: [Contacts et partage]
      summary: 'Modifier un contact, cocher ou décocher ses cases.'
      description: |
        Décocher « Suiveur » retire le suiveur de toutes les navigations, immédiatement. Seuls les
        champs envoyés sont modifiés : la dernière modification reçue l'emporte, champ par champ,
        sans refus si le contact a changé entre-temps sur un autre support (RG-COM-04). Retirer le
        numéro décoche « Contact SOS ». Décocher « Suiveur » annule l'invitation en attente ; le
        recocher envoie une nouvelle invitation.
