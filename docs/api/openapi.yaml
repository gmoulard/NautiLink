        '200':
          description: 'Alertes.'
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AlerteSos'}
  /v1/alertes-sos/{alerteId}:
    parameters:
      - name: alerteId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [Alertes SOS]
      summary: 'Envoyer une alerte SOS (en navigation ou depuis l''accueil).'
      description: |
        Envoyée en priorité, hors de la file ordinaire, et renvoyée jusqu'à réception (iPhone sans
        Internet : dès le retour de la connexion). Acceptée quel que soit le quota ou l'abonnement.
        Rejouable sans doublon. Le serveur enregistre l'alerte dans le journal (ou dans l'historique
        du bateau hors navigation), envoie l'e-mail aux suiveurs (de la navigation, ou de périmètre
        navigateur hors navigation) et aux contacts SOS dont l'e-mail est connu, sauf les personnes
        décochées au démarrage, avec copie au navigateur, et les notifications push SOS. Un SOS
        acquis après une clôture automatique est enregistré comme un SOS depuis l'accueil
        (RG-ECO-12).
      x-regles: [RG-ECO-12, RG-SOS-19, RG-SOS-02, RG-SOS-03, RG-SOS-04, RG-SOS-06, RG-SOS-09, RG-SOS-10, RG-SOS-11, RG-SOS-12,
        RG-SOS-15, RG-NAV-25, RG-NAV-27, RG-IOS-01, RG-IOS-03, RG-IOS-06, RG-AND-08, RG-NOT-02, RG-NOT-03,
        RG-JRN-02, RG-JRN-07, RG-PRM-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlerteSos'}
      responses:
        '200':
          description: 'Déjà reçue ; aucun doublon.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlerteSos'}
        '201':
          description: 'Alerte enregistrée, e-mails partis.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlerteSos'}
  /v1/alertes-sos/{alerteId}/sms:
    parameters:
      - name: alerteId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [Alertes SOS]
      summary: 'Statut d''envoi de chaque SMS SOS (Android), mis à jour à chaque changement.'
      x-regles: [RG-SOS-12, RG-SMS-07, RG-SMS-08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/StatutSms'}
      responses:
        '204': {description: Statuts enregistrés.}

  # --------------------------------------------------- Quota et abonnement
  /v1/quota:
    get:
      tags: [Quota et abonnement]
      summary: 'Quota et état de l''abonnement, calculés par le serveur.'
      x-regles: [RG-ECO-01, RG-ECO-02, RG-ECO-03, RG-ECO-04, RG-ECO-05, RG-ECO-06, RG-ECO-07, RG-ECO-09]
      responses:
        '200':
          description: 'Quota.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quota'}
  /v1/abonnement/stripe:
    post:
      tags: [Quota et abonnement]
      summary: 'Ouvrir un paiement par carte bancaire avec Stripe (Web).'
      x-regles: [RG-ECO-06, RG-ECO-07, RG-ECO-11]
      responses:
        '201':
          description: 'Adresse de la page de paiement Stripe.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  adressePaiement: {type: string, format: uri}
        '409': {$ref: '#/components/responses/Conflit'}
  /v1/abonnement/google-play:
    post:
      tags: [Quota et abonnement]
      summary: 'Faire reconnaître un achat unique Google Play (Android).'
      description: 'Le serveur vérifie l''achat auprès de Google avant d''ouvrir l''abonnement ; un paiement échoué n''ouvre rien.'
      x-regles: [RG-ECO-06, RG-ECO-07, RG-ECO-11, RG-ECO-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jetonAchat]
              properties:
                jetonAchat: {type: string}
      responses:
        '200':
          description: 'Abonnement ouvert.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quota'}
        '402': {description: 'Paiement non confirmé (`paiement_non_confirme`).'}
        '409': {description: 'Achat déjà reconnu pour un autre compte (`achat_deja_utilise`).'}
        '503': {description: 'Achat pas encore ouvert sur ce serveur : identifiants absents (`achat_non_configure`).'}
  /v1/abonnement/app-store:
    post:
      tags: [Quota et abonnement]
      summary: 'Faire reconnaître un achat intégré de l''App Store (iPhone).'
      x-regles: [RG-ECO-06, RG-ECO-07, RG-ECO-11, RG-IOS-07, RG-ECO-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionSignee]
              properties:
                transactionSignee: {type: string}
      responses:
        '200':
          description: 'Abonnement ouvert.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quota'}
        '402': {description: 'Paiement non confirmé (`paiement_non_confirme`).'}
        '409': {description: 'Achat déjà reconnu pour un autre compte (`achat_deja_utilise`).'}
        '503': {description: 'Achat pas encore ouvert sur ce serveur : identifiants absents (`achat_non_configure`).'}
  /v1/rappels/stripe:
    post:
      tags: [Quota et abonnement]
      summary: 'Avis de paiement envoyé par Stripe (signature vérifiée).'
      security: []
      x-regles: [RG-ECO-07, RG-ECO-11, RG-ECO-05]
      responses:
        '204': {description: Avis traité.}

  # -------------------------------------------------------------- Données
  /v1/compte/export.json:
    get:
      tags: [Données]
      summary: 'Export des données du compte en JSON.'
      x-regles: [RG-DON-02]
      responses:
        '200':
          description: 'Export.'
          content:
            application/json: {schema: {type: object}}
  /v1/compte/traces.gpx:
    get:
      tags: [Données]
      summary: 'Traces GPX de toutes les navigations du compte.'
      x-regles: [RG-DON-02]
      responses:
        '200':
          description: 'Traces.'
          content:
            application/gpx+xml: {schema: {type: string}}

  # ------------------------------------------------------- Administration
  /v1/annonces:
    get:
      tags: [Comptes]
      summary: 'Annonces de l''administrateur à afficher en bandeau (accueil mobile, tableau de bord Web).'
      description: 'Annonces dont la date de fin n''est pas passée et que l''utilisateur n''a pas fermées.'
      x-regles: [RG-ADM-02, RG-ADM-06]
      responses:
        '200':
          description: 'Annonces.'
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Annonce'}
  /v1/annonces/{annonceId}/fermeture:
    parameters:
      - name: annonceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Comptes]
      summary: 'Fermer une annonce pour l''utilisateur connecté.'
      x-regles: [RG-ADM-06]
      responses:
        '204': {description: Annonce fermée.}
        '404': {$ref: '#/components/responses/Introuvable'}
  /v1/admin/{ressource}:
    parameters:
      - name: ressource
        in: path
        required: true
        schema:
          type: string
          enum: [utilisateurs, bateaux, contacts, navigations, evenements, alertes-sos, abonnements, annonces,
            supervision, journal, statistiques]
    get:
      tags: [Administration]
      summary: 'Consulter (espace administrateur, profil unique d''administrateur).'
      description: 'Appelée par l''espace administrateur (`/admin/`), distinct de l''espace utilisateur. Chaque appel est tracé et gardé 3 ans. Les annonces s''affichent aux utilisateurs par `GET /v1/annonces` (RG-ADM-06). Administrateurs : adresses e-mail confirmées listées dans `NAUTILINK_ADMINS` (RG-ADM-07). `contacts` et `bateaux` acceptent `utilisateur` (identifiant du compte) ; une fonction pas encore réalisée rend 404 `non_disponible`.'
      x-regles: [RG-ADM-01, RG-ADM-02, RG-ADM-03, RG-ADM-07, RG-DON-02]
      security:
        - cookieAdmin: []
      parameters:
        - {$ref: '#/components/parameters/Curseur'}
        - name: recherche
          in: query
          schema: {type: string}
      responses:
        '200':
          description: 'Page de résultats.'
          content:
            application/json: {schema: {type: object}}
        '403': {$ref: '#/components/responses/Interdit'}
    post:
      tags: [Administration]
      summary: 'Créer (annonce, rattachement d''un bateau, abonnement…).'
      x-regles: [RG-ADM-02, RG-ADM-03]
      security:
        - cookieAdmin: []
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '201': {description: Créé et tracé.}
  /v1/admin/{ressource}/{id}:
    parameters:
      - name: ressource
        in: path
        required: true
        schema: {type: string}
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Administration]
      summary: 'Modifier toute donnée, positions et alertes SOS comprises ; action tracée.'
      description: 'Pour `bateaux`, `proprietaireId` ou `proprietaireEmail` rattache le bateau à un autre compte (le téléphone associé est alors retiré).'
      x-regles: [RG-ADM-03]
      security:
        - cookieAdmin: []
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Modifié et tracé.}
    delete:
      tags: [Administration]
      summary: 'Supprimer toute donnée ; action tracée.'
      x-regles: [RG-ADM-03, RG-DON-01]
      security:
        - cookieAdmin: []
      responses:
        '204': {description: Supprimé et tracé.}

components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
      description: 'Jeton de session des applications mobiles ; expire après 90 jours sans usage, jamais sur le téléphone associé pendant une navigation en cours (RG-CPT-08).'
    cookieSession:
      type: apiKey
      in: cookie
      name: nautilink_session
      description: 'Session de l''Application web (cookie HttpOnly, Secure, SameSite=Lax).'
    cookieAdmin:
      type: apiKey
      in: cookie
      name: nautilink_admin
      description: 'Session de l''espace administrateur, distincte de celle des utilisateurs.'

  parameters:
    NavigationId:
      name: navigationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvenementId:
      name: evenementId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BateauId:
      name: bateauId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContactId:
      name: contactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AppareilId:
      name: appareilId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Depuis:
      name: depuis
      in: query
      description: 'Curseur rendu par l''appel précédent ; absent, tout est rendu.'
      schema: {type: string}
    Curseur:
      name: curseur
      in: query
      schema: {type: string}

  responses:
    NonAuthentifie:
      description: 'Session absente ou expirée.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}
    Interdit:
      description: 'Droit insuffisant (suiveur en lecture seule, pas propriétaire, événement non modifiable…).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}
    Introuvable:
      description: 'Inexistant, ou sans accès (le serveur ne distingue pas les deux).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}
    Conflit:
      description: 'Conflit avec l''état du serveur.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}
    TropDEssais:
      description: 'Trop d''essais (protection contre les essais répétés) ; en-tête Retry-After en secondes.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}
    Invalide:
      description: 'Données invalides.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Erreur'}

  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [non_authentifie, avertissement_a_accepter, interdit, introuvable, invalide,
            pas_proprietaire, telephone_non_associe, navigation_en_cours, quota_epuise,
            evenement_different, evenement_non_modifiable, limite_photos, note_vocale_trop_longue,
            contact_sos_sans_telephone, navigation_cloturee, invitation_deja_acceptee, deja_abonne,
            email_deja_utilise, email_non_verifie, trop_d_essais, fournisseur_indisponible, service_indisponible, erreur_interne]
        message: {type: string, description: Texte dans la langue de l'utilisateur.}
        disponibleLe:
          type: string
          format: date-time
          description: 'Pour `quota_epuise` — heure à laquelle des minutes redeviennent disponibles (RG-ECO-04).'

    Annonce:
      type: object
      properties:
        id: {type: string, format: uuid}
        texte: {type: string}
        finLe: {type: [string, 'null'], format: date-time, description: 'Date de fin choisie par l''administrateur (RG-ADM-06).'}

    Avertissement:
      type: object
      properties:
        version: {type: string, examples: ['2026-11-24']}
        adresseTexte: {type: string, format: uri}

    CreationCompte:
      type: object
      required: [email, motDePasse, nom, avertissementVersion]
      properties:
        email: {type: string, format: email}
        motDePasse: {type: string, minLength: 8}
        nom: {type: string}
        langue: {$ref: '#/components/schemas/Langue'}
        avertissementVersion: {type: string, description: Version acceptée en cochant la case.}

    Connexion:
      oneOf:
        - type: object
          required: [email, motDePasse]
          properties:
            email: {type: string, format: email}
            motDePasse: {type: string}
            avertissementVersion: {type: string, description: 'À envoyer quand le texte a changé depuis la dernière acceptation (réponse 428).'}
        - type: object
          required: [fournisseur, jetonIdentite]
          properties:
            fournisseur: {type: string, enum: [google, apple]}
            jetonIdentite: {type: string}
            avertissementVersion: {type: string}
            nom: {type: string, description: 'Nom du compte créé, si le jeton n''en donne pas.'}

    Session:
      type: object
      properties:
        jetonAcces: {type: string}
        jetonRenouvellement: {type: string}
        expireLe: {type: string, format: date-time, description: 'Expiration si la session n''est plus utilisée (90 jours, repoussée à chaque usage, RG-CPT-08).'}

    Langue:
      type: string
      enum: [fr, en]
      description: 'RG-PRM-03.'

    Profil:
      allOf:
        - {$ref: '#/components/schemas/ProfilModifiable'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            emailVerifie: {type: boolean, description: 'Adresse confirmée par le lien reçu ; exigée pour démarrer une navigation et pour inviter (RG-CPT-09).'}
            avertissementVersionAcceptee: {type: string}
            avertissementAccepteLe: {type: string, format: date-time}

    ProfilModifiable:
      type: object
      properties:
        nom: {type: string}
        telephone: {type: [string, 'null'], description: Format international E.164. Sert aussi à la copie SMS au navigateur (RG-SMS-08).}
        recevoirSms: {type: boolean, description: « Recevoir les SMS » (RG-SMS-01).}
        langue: {$ref: '#/components/schemas/Langue'}
        emailsDebut: {type: boolean, description: E-mails de début de navigation (RG-NOT-02).}
        push:
          type: object
          description: 'Types de notifications push du suiveur ; le SOS n''est pas désactivable (RG-IOS-06, RG-AND-08).'
          properties:
            debut: {type: boolean, default: true}
            fin: {type: boolean, default: true}
            photo: {type: boolean, default: true}
            positionEnRetard: {type: boolean, default: true}

    Appareil:
      type: object
      required: [plateforme]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        plateforme: {type: string, enum: [android, ios]}
        nom: {type: string, description: 'Nom du modèle, pour le reconnaître dans la liste.'}
        jetonPush: {type: [string, 'null'], description: Jeton APNs ou FCM.}
        versionApplication: {type: string}

    BateauModifiable:
      type: object
      required: [nom, type]
      properties:
        nom: {type: string}
        type: {type: string, enum: [voilier, moteur]}
        longueurMetres: {type: number}
        immatriculation: {type: string}
        portAttache: {type: string}
        moteur: {type: string}
        autonomie: {type: string}
        capaciteCarburantLitres: {type: number}
        vitesseNoeuds: {type: number}
        tirantEauMetres: {type: number}

    Bateau:
      allOf:
        - {$ref: '#/components/schemas/BateauModifiable'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            proprietaireId: {type: string, format: uuid}
            appareilAssocieId: {type: [string, 'null'], format: uuid, description: RG-BAT-02.}
            aUnePhoto: {type: boolean}

    Perimetre:
      type: string
      enum: [navigation, navigateur]
      description: 'RG-PAR-02.'

    ContactModifiable:
      type: object
      properties:
        id: {type: string, format: uuid, description: Tiré par le client pour un ajout hors connexion.}
        nom: {type: string}
        telephone: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        suiveur: {type: boolean, default: true}
        contactSos: {type: boolean, default: true}
        perimetre: {$ref: '#/components/schemas/Perimetre'}
        navigationId: {type: [string, 'null'], format: uuid}

    Contact:
      allOf:
        - {$ref: '#/components/schemas/ContactModifiable'}
        - type: object
          properties:
            version: {type: integer}
            utilisateurId: {type: [string, 'null'], format: uuid, description: 'Compte du suiveur, une fois l''invitation acceptée.'}
            etatInvitation: {type: string, enum: [aucune, envoyee, acceptee, annulee]}
            modifieLe: {type: string, format: date-time}
            recevoirSms: {type: boolean, description: 'Faux quand le suiveur a refusé les SMS dans son profil (« Recevoir les SMS », RG-SMS-01) ; vrai sans compte rattaché.'}

    ListeContacts:
      type: object
      properties:
        contacts:
          type: array
          items: {$ref: '#/components/schemas/Contact'}
        supprimes:
          type: array
          items: {type: string, format: uuid}
        curseur: {type: string}

    NouvelleInvitation:
      type: object
      required: [canal, perimetre]
      properties:
        contactId: {type: string, format: uuid}
        canal: {type: string, enum: [email, telephone]}
        email: {type: string, format: email}
        telephone: {type: string}
        perimetre: {$ref: '#/components/schemas/Perimetre'}
        navigationId: {type: string, format: uuid}

    Invitation:
      allOf:
        - {$ref: '#/components/schemas/NouvelleInvitation'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            lien: {type: string, format: uri, description: 'Lien d''invitation, jamais un accès public (RG-PAR-05).'}
            etat: {type: string, enum: [envoyee, acceptee, annulee]}
            creeeLe: {type: string, format: date-time}

    Acces:
      type: object
      properties:
        id: {type: string, format: uuid}
        navigateur: {$ref: '#/components/schemas/Personne'}
        suiveur: {$ref: '#/components/schemas/Personne'}
        perimetre: {$ref: '#/components/schemas/Perimetre'}
        navigationId: {type: [string, 'null'], format: uuid}
        accordeLe: {type: string, format: date-time}

    Personne:
      type: object
      properties:
        id: {type: string, format: uuid}
        nom: {type: string}
        telephone: {type: [string, 'null']}
        email: {type: [string, 'null']}

    FrequenceMinutes:
      type: integer
      enum: [15, 30, 60, 120, 180, 360, 720, 1440, 2880, 14400]
      description: 'RG-NAV-05.'

    Parametres:
      type: object
      description: 'Paramètres généraux ; leur copie modifiée au démarrage forme les paramètres de navigation (RG-NAV-06). Ne s''appliquent jamais aux SMS SOS (RG-SOS-14).'
      properties:
        version: {type: integer, readOnly: true, description: 'Numéro incrémenté à chaque modification ; ne sert jamais à refuser une modification (RG-COM-04).'}
        smsActifs: {type: [boolean, 'null'], description: Interrupteur général des SMS ordinaires.}
        smsParType:
          type: object
          description: 'Champs envoyés seuls modifiés, comme pour le reste (RG-COM-04).'
          properties:
            debut: {type: [boolean, 'null']}
            positionsAutomatiques: {type: [boolean, 'null']}
            positionsManuelles: {type: [boolean, 'null']}
            notes: {type: [boolean, 'null']}
            photos: {type: [boolean, 'null']}
            notesVocales: {type: [boolean, 'null']}
            incidents: {type: [boolean, 'null'], description: 'Incidents et avaries (RG-JRN-11, D-154).'}
            fin: {type: [boolean, 'null']}
        photoEnMms: {type: [boolean, 'null'], description: Joindre la photo en MMS (RG-SMS-05).}
        frequenceParDefaut:
          oneOf:
            - {$ref: '#/components/schemas/FrequenceMinutes'}
            - {type: 'null'}
        modifieLe: {type: string, format: date-time, readOnly: true}

    Position:
      type: object
      required: [latitude, longitude, heureAcquisition]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        precisionMetres: {type: number}
        heureAcquisition: {type: string, format: date-time}

    Lieu:
      type: object
      properties:
        nom: {type: [string, 'null'], description: 'Lieu le plus proche (géocodage inverse) ; absent, afficher les coordonnées.'}
        position: {$ref: '#/components/schemas/Position'}

    Meteo:
      type: object
      description: 'RG-NAV-28 ; contenu exact selon l''API de Météo-France (Q-39).'
      properties:
        releveeLe: {type: string, format: date-time}
        ventVitesseNoeuds: {type: number}
        ventDirectionDegres: {type: number}
        etatMer: {type: string}
        pressionHpa: {type: number}

    DemarrageNavigation:
      type: object
      required: [bateauId, appareilId, frequenceMinutes, personnesABord, debut]
      properties:
        bateauId: {type: string, format: uuid}
        appareilId: {type: string, format: uuid}
        destination:
          type: [object, 'null']
          properties:
            texte: {type: string}
            position: {$ref: '#/components/schemas/Position'}
        frequenceMinutes: {$ref: '#/components/schemas/FrequenceMinutes'}
        parametres: {$ref: '#/components/schemas/Parametres'}
        personnesABord: {type: integer, minimum: 1}
        personnesAlertees:
          type: array
          description: 'Contacts cochés à l''écran de démarrage ; les décochés ne reçoivent rien de cette navigation, SOS compris (RG-NAV-25).'
          items: {type: string, format: uuid}
        debut:
          allOf: [{$ref: '#/components/schemas/Evenement'}]
          description: 'Le décalage horaire de debut.heureAcquisition (RFC 3339, ex. 2026-11-26T14:32:00+01:00) est celui du téléphone ; le serveur le garde pour donner l''heure locale de toute la navigation dans les messages envoyés (RG-PRM-07).'

    NavigationModifiable:
      type: object
      properties:
        nom: {type: string}
        destination:
          type: [object, 'null']
          properties:
            texte: {type: string}
            position: {$ref: '#/components/schemas/Position'}
        bateauId: {type: string, format: uuid}
        debut: {type: string, format: date-time}
        fin: {type: string, format: date-time}

    ResumeNavigation:
      type: object
      properties:
        id: {type: string, format: uuid}
        nom: {type: string}
        role: {type: string, enum: [navigateur, suiveur]}
        etat: {type: string, enum: [en_cours, terminee, corbeille]}
        bateau: {type: object, properties: {id: {type: string, format: uuid}, nom: {type: string}}}
        debut: {type: string, format: date-time}
        fin: {type: [string, 'null'], format: date-time}
        lieuDepart: {$ref: '#/components/schemas/Lieu'}
        lieuArrivee: {$ref: '#/components/schemas/Lieu'}
        dureeMinutes: {type: integer}
        distanceMetres: {type: number}
        dernierePosition: {$ref: '#/components/schemas/Lieu'}
        supprimeeDefinitivementLe: {type: [string, 'null'], format: date-time, description: Corbeille seulement.}

    Navigation:
      allOf:
        - {$ref: '#/components/schemas/ResumeNavigation'}
        - type: object
          properties:
            version: {type: integer}
            navigateur: {$ref: '#/components/schemas/Personne'}
            destination:
              type: [object, 'null']
              properties:
                texte: {type: string}
                position: {$ref: '#/components/schemas/Position'}
            debutEnregistre: {type: string, format: date-time, description: 'Heure enregistrée par le téléphone, base du quota (RG-ECO-02).'}
            finEnregistree: {type: [string, 'null'], format: date-time}
            frequenceMinutes: {$ref: '#/components/schemas/FrequenceMinutes'}
            personnesABord: {type: integer}
            meteoDepart: {$ref: '#/components/schemas/Meteo'}
            meteoArrivee: {$ref: '#/components/schemas/Meteo'}
            clotureAutomatiqueLe: {type: [string, 'null'], format: date-time, description: RG-ECO-05.}
            fiche: {$ref: '#/components/schemas/Bateau'}
            suiveurs:
              type: array
              items: {$ref: '#/components/schemas/Personne'}
            contactsSos:
              type: array
              items: {$ref: '#/components/schemas/Personne'}

    Evenement:
      type: object
      required: [id, type, heureAcquisition]
      properties:
        id: {type: string, format: uuid, description: Tiré par le téléphone (ou le Web) à la création ; clé contre les doublons.}
        type:
          type: string
          enum: [debut, position_automatique, position_manuelle, note, photo, note_vocale, sos, fin, ajout, incident]
          description: 'RG-JRN-02. `incident` : incident ou avarie (RG-JRN-11), texte obligatoire, une photo (image/jpeg) ou une note vocale (audio/mp4) facultative, pendant la navigation ; jamais ajouté depuis le Web après la fin.'
        heureAcquisition: {type: string, format: date-time}
        numeroOrdre: {type: integer, description: Rang de création sur le téléphone pour cette navigation (08-architecture.md §5).}
        position: {$ref: '#/components/schemas/Position'}
        gpsDisponible: {type: boolean}
        lieu: {type: [string, 'null'], readOnly: true, description: RG-JRN-10.}
        texte: {type: [string, 'null']}
        fichier:
          type: [object, 'null']
          properties:
            typeMedia: {type: string, enum: [image/jpeg, audio/mp4]}
            tailleOctets: {type: integer}
            dureeSecondes: {type: integer, maximum: 60}
            recu: {type: boolean, readOnly: true}
        origine: {type: string, enum: [android, ios, web]}
        masque: {type: boolean, readOnly: true, description: Hors de la plage modifiée (RG-NAV-22).}
        recuLe: {type: string, format: date-time, readOnly: true}
        alerteSosId: {type: [string, 'null'], format: uuid}

    AlerteSos:
      type: object
      required: [id, bateauId, heureDeclenchement]
      properties:
        id: {type: string, format: uuid}
        bateauId: {type: string, format: uuid}
        navigationId: {type: [string, 'null'], format: uuid, description: Absent pour un SOS depuis l'accueil (RG-SOS-15).}
        appareilId: {type: string, format: uuid}
        heureDeclenchement:
          type: string
          format: date-time
          description: 'Avec le décalage horaire du téléphone (RFC 3339), gardé par le serveur pour l''heure locale de l''e-mail SOS et de la notification push (RG-PRM-07).'
        position: {$ref: '#/components/schemas/Position'}
        naturePosition:
          type: string
          enum: [actuelle, derniere_connue, aucune]
          description: 'RG-SOS-09 à RG-SOS-11.'
        problemeRencontre: {type: [string, 'null'], description: RG-SOS-02.}
        personnesABord: {type: integer}
        sms:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/StatutSms'}
        emailsEnvoyesA:
          type: array
          readOnly: true
          items: {type: string, format: email}

    StatutSms:
      type: object
      properties:
        contactId: {type: [string, 'null'], format: uuid, description: Vide pour la copie au navigateur.}
        telephone: {type: string}
        rang: {type: integer, enum: [1, 2], description: 'Premier ou second SMS SOS (RG-SOS-07, RG-SOS-08).'}
        statut: {type: string, enum: [en_attente, accepte_pour_envoi, livraison_confirmee, echec]}
        essais: {type: integer}
        misAJourLe: {type: string, format: date-time}

    Quota:
      type: object
      properties:
        consommeMinutes: {type: integer}
        disponibleMinutes: {type: integer}
        prochainesMinutes:
          type: array
          description: 'Minutes qui redeviennent disponibles, et quand.'
          items:
            type: object
            properties:
              minutes: {type: integer}
              disponiblesLe: {type: string, format: date-time}
        epuise: {type: boolean}
        clotureAutomatiqueLe: {type: [string, 'null'], format: date-time}
        abonnement:
          type: object
          properties:
            actif: {type: boolean}
            canal: {type: [string, 'null'], enum: [web, google_play, app_store, null]}
            debut: {type: [string, 'null'], format: date-time}
            fin: {type: [string, 'null'], format: date-time, description: Début + 10 ans (RG-ECO-06).}

    ElementFile:
      type: object
      required: [operation, id]
      description: 'Un envoi de la file d''attente du téléphone.'
      properties:
        operation: {type: string, enum: [demarrage, evenement, fin, alerte_sos, statuts_sms]}
        id: {type: string, format: uuid, description: 'Identifiant de la navigation, de l''événement ou de l''alerte.'}
        navigationId: {type: string, format: uuid}
        contenu: {type: object, description: Corps de l'appel unitaire correspondant.}

    ResultatElement:
      type: object
      properties:
        id: {type: string, format: uuid}
        statut: {type: integer, description: Code HTTP qu'aurait rendu l'appel unitaire.}
        erreur: {$ref: '#/components/schemas/Erreur'}
