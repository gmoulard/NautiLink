  # ------------------------------------------------------- Journal de bord
  /v1/navigations/{navigationId}/evenements:
    parameters:
      - {$ref: '#/components/parameters/NavigationId'}
    get:
      tags: [Journal de bord]
      summary: 'Journal de bord, dans l''ordre de l''heure d''acquisition.'
      description: |
        `depuis` rend seulement ce que le serveur a reçu ou modifié depuis ce curseur : la page Web
        d'une navigation en cours l'interroge à intervalles réguliers pour se mettre à jour
        (08-architecture.md §4).
      x-regles: [RG-JRN-01, RG-JRN-02, RG-JRN-03, RG-JRN-09, RG-JRN-10, RG-PAR-07, RG-NAV-22, RG-ECO-08]
      parameters:
        - {$ref: '#/components/parameters/Depuis'}
      responses:
        '200':
          description: 'Événements.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  evenements:
                    type: array
                    items: {$ref: '#/components/schemas/Evenement'}
                  supprimes:
                    type: array
                    description: 'Avec `depuis` : identifiants des événements supprimés depuis ce curseur.'
                    items: {type: string, format: uuid}
                  curseur: {type: string, description: À renvoyer dans `depuis` à l'appel suivant.}
  /v1/navigations/{navigationId}/evenements/{evenementId}:
    parameters:
      - {$ref: '#/components/parameters/NavigationId'}
      - {$ref: '#/components/parameters/EvenementId'}
    put:
      tags: [Journal de bord]
      summary: 'Envoyer un événement (position, note, photo, note vocale) ou un ajout complémentaire depuis le Web.'
      description: |
        Idempotent : même identifiant et même contenu → 200, rien n'est créé deux fois ; même
        identifiant et contenu différent → 409 `evenement_different`. Le fichier d'une photo ou d'une
        note vocale suit par `PUT /v1/fichiers/{evenementId}`. Refusé au-delà de 20 photos
        (`limite_photos`). Une nouvelle photo déclenche la notification push des suiveurs ; une
        position remet à zéro le délai de « position en retard ». Ajouts depuis le Web : navigation
        terminée, navigateur seulement. Après une clôture automatique, un événement acquis avant
        l'heure de clôture est gardé, un événement acquis après est refusé (409
        `navigation_cloturee`) ; l'application arrête alors les positions automatiques et le dit
        au navigateur (RG-ECO-12).
      x-regles: [RG-JRN-02, RG-JRN-05, RG-JRN-08, RG-GPS-02, RG-GPS-04, RG-NAV-10, RG-NAV-11,
        RG-COM-01, RG-IOS-06, RG-AND-08, RG-SMS-05, RG-SMS-06, RG-ECO-12]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Evenement'}
      responses:
        '200':
          description: 'Déjà reçu ; aucun doublon.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evenement'}
        '201':
          description: 'Événement enregistré.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evenement'}
        '403': {$ref: '#/components/responses/Interdit'}
        '409': {$ref: '#/components/responses/Conflit'}
    patch:
      tags: [Journal de bord]
      summary: 'Modifier une note, une photo, une note vocale ou un ajout (navigateur, Web ou mobile).'
      description: 'Refusé pour début, fin, positions et alerte SOS (`evenement_non_modifiable`).'
      x-regles: [RG-JRN-06, RG-JRN-07]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texte: {type: string}
      responses:
        '200':
          description: 'Événement modifié.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evenement'}
        '403': {$ref: '#/components/responses/Interdit'}
    delete:
      tags: [Journal de bord]
      summary: 'Supprimer une note, une photo, une note vocale ou un ajout (navigateur).'
      description: 'Refusé pour début, fin, positions et alerte SOS (`evenement_non_modifiable`).'
      x-regles: [RG-JRN-06, RG-JRN-07]
      responses:
        '204': {description: Événement supprimé.}
        '403': {$ref: '#/components/responses/Interdit'}
  /v1/fichiers/{evenementId}:
    parameters:
      - {$ref: '#/components/parameters/EvenementId'}
    put:
      tags: [Journal de bord]
      summary: 'Déposer le fichier d''une photo (JPEG, environ 1 Mo) ou d''une note vocale (AAC .m4a, 1 minute au plus).'
      description: 'Rejouable ; un dépôt interrompu se refait en entier. Stocké dans PostgreSQL (D-86).'
      x-regles: [RG-JRN-04, RG-JRN-08, RG-SMS-05, RG-SMS-06]
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
          audio/mp4: {schema: {type: string, contentMediaType: audio/mp4}}
      responses:
        '204': {description: Fichier enregistré.}
        '413': {description: Fichier trop gros.}
        '422': {$ref: '#/components/responses/Invalide'}
    get:
      tags: [Journal de bord]
      summary: 'Lire une photo ou écouter une note vocale (navigateur et suiveurs ayant accès).'
      description: 'Réservé aux comptes ayant accès. Le lien des SMS de photo et de note vocale mène à la page de la navigation sur l''Application web, après connexion ; aucun accès sans compte (RG-SMS-09).'
      x-regles: [RG-JRN-04, RG-JRN-09, RG-PAR-01, RG-PAR-07, RG-SMS-05, RG-SMS-06, RG-SMS-09]
      responses:
        '200':
          description: 'Fichier.'
          content:
            image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
            audio/mp4: {schema: {type: string, contentMediaType: audio/mp4}}
        '404': {$ref: '#/components/responses/Introuvable'}
  /v1/synchronisation:
    post:
      tags: [Journal de bord]
      summary: 'Vider la file d''attente du téléphone en un appel.'
      description: |
        Lot d'envois en attente (démarrage, événements, fin, alertes SOS), dans l'ordre
        d'acquisition. Chaque élément est traité comme l'appel unitaire correspondant et reçoit son
        propre résultat ; un élément refusé ne bloque pas les suivants. Mécanisme :
        08-architecture.md §5.
      x-regles: [RG-GPS-04, RG-NAV-14, RG-IOS-03, RG-COM-01, RG-COM-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elements]
              properties:
                appareilId: {type: string, format: uuid}
                elements:
                  type: array
                  maxItems: 200
                  items: {$ref: '#/components/schemas/ElementFile'}
      responses:
        '200':
          description: 'Un résultat par élément, dans le même ordre.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultats:
                    type: array
                    items: {$ref: '#/components/schemas/ResultatElement'}

