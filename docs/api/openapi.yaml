        - name: etat
          in: query
          schema: {type: string, enum: [en_cours, terminee]}
        - name: bateauId
          in: query
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/Curseur'}
      responses:
        '200':
          description: 'Page de navigations.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  navigations:
                    type: array
                    items: {$ref: '#/components/schemas/ResumeNavigation'}
                  curseurSuivant: {type: [string, 'null']}
  /v1/navigations/{navigationId}:
    parameters:
      - {$ref: '#/components/parameters/NavigationId'}
    put:
      tags: [Navigations]
      summary: 'Démarrer une navigation (« Envoi message – Début de navigation »).'
      description: |
        Envoyé par l'application mobile à la confirmation du démarrage, avec l'identifiant tiré par le
        téléphone et l'événement de début (heure et position d'acquisition). Rejouable : le même
        identifiant avec le même contenu rend 200 sans rien créer de plus.

        Le serveur vérifie : propriétaire du bateau (`pas_proprietaire`), téléphone associé, une
        seule navigation en cours par bateau et par téléphone (`navigation_en_cours`), quota
        (`quota_epuise`, avec l'heure à laquelle des minutes redeviennent disponibles), adresse
        e-mail confirmée (`email_non_verifie`, RG-CPT-09). Il génère le
        nom, relève la météo, envoie l'e-mail et les notifications push de début.
        Démarrage hors connexion et quota non vérifiable : RG-COM-06.
      x-regles: [RG-CPT-09, RG-NAV-01, RG-NAV-02, RG-NAV-03, RG-NAV-04, RG-NAV-05, RG-NAV-06, RG-NAV-07, RG-NAV-08,
        RG-NAV-11, RG-NAV-17, RG-NAV-25, RG-NAV-27, RG-NAV-28, RG-CPT-05, RG-ECO-04, RG-NOT-02,
        RG-IOS-06, RG-AND-08, RG-BAT-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemarrageNavigation'}
      responses:
        '200':
          description: 'Déjà reçue (renvoi) ; aucun doublon.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Navigation'}
        '201':
          description: 'Navigation créée.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Navigation'}
        '403': {$ref: '#/components/responses/Interdit'}
        '409': {$ref: '#/components/responses/Conflit'}
    get:
      tags: [Navigations]
      summary: 'Page d''une navigation (navigateur ou suiveur ayant accès).'
      description: 'Comprend la fiche du bateau, les suiveurs et les contacts SOS du navigateur (RG-PAR-08). Introuvable pour un suiveur quand elle est dans la corbeille ou quand son accès est retiré.'
      x-regles: [RG-NAV-16, RG-NAV-27, RG-NAV-28, RG-PAR-01, RG-PAR-07, RG-PAR-08, RG-NAV-20, RG-PAR-06,
        RG-ECO-08, RG-IOS-05]
      responses:
        '200':
          description: 'Navigation.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Navigation'}
        '404': {$ref: '#/components/responses/Introuvable'}
    patch:
      tags: [Navigations]
      summary: 'Modifier nom, destination, bateau (parmi les siens) et heures (navigateur seulement).'
      description: 'Un changement d''heures ne change pas le quota ; les événements hors de la nouvelle plage sont gardés et marqués `masque`. Seuls les champs envoyés sont modifiés ; la dernière modification reçue l''emporte, champ par champ (RG-COM-04).'
      x-regles: [RG-NAV-17, RG-NAV-22, RG-ECO-02, RG-PAR-07, RG-COM-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NavigationModifiable'}
      responses:
        '200':
          description: 'Navigation modifiée.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Navigation'}
        '403': {$ref: '#/components/responses/Interdit'}
    delete:
      tags: [Navigations]
      summary: 'Mettre une navigation terminée dans la corbeille (Web, navigateur seulement).'
      description: 'Refusé pour une navigation en cours (`navigation_en_cours`) et depuis une session des applications mobiles (`web_seulement`). Rejouable : une navigation déjà dans la corbeille y reste, sans repousser sa suppression définitive. Le temps reste décompté du quota. Dans la corbeille, la navigation ne se modifie plus avant sa restauration (`navigation_corbeille`, RG-NAV-30).'
      x-regles: [RG-NAV-20, RG-NAV-21]
      responses:
        '204': {description: 'Navigation dans la corbeille, restaurable 30 jours.'}
        '403': {$ref: '#/components/responses/Interdit'}
        '409': {$ref: '#/components/responses/Conflit'}
  /v1/navigations/{navigationId}/fin:
    parameters:
      - {$ref: '#/components/parameters/NavigationId'}
    put:
      tags: [Navigations]
      summary: 'Terminer la navigation (« Terminer la navigation » confirmé).'
      description: |
        Porte l'événement de fin, avec son heure réelle même s'il arrive tard. Clôture la navigation
        même si un SMS a échoué. Rejouable. Rend l'adresse de la page de la navigation sur
        l'Application web, que l'application ouvre. Le serveur relève la météo d'arrivée et envoie les
        notifications push de fin. Après une clôture automatique, une fin acquise après l'heure de
        clôture est refusée (`navigation_cloturee`, RG-ECO-12).
      x-regles: [RG-NAV-13, RG-NAV-14, RG-NAV-28, RG-NAV-16, RG-IOS-06, RG-AND-08, RG-ECO-12]
      requestBody:
        required: true
